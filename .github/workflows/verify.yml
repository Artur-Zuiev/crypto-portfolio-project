name: Backend compile and frontend syntax

on:
  push:
    branches:
      - design/fintech-dashboard-v1-2026
  pull_request:

jobs:
  backend-compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cryptoportfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/cryptoportfolio/pom.xml
      - name: Compile backend and tests
        run: mvn -B -DskipTests test-compile

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in frontend/js/*.js; do
            node --check "$file"
          done
