<!-- ==================================================
   BLOCK 01 — DOCUMENT SETTINGS / НАСТРОЙКИ ДОКУМЕНТА
================================================== -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Crypto Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <!-- ==================================================
    BLOCK 02 — AUTH CARD / КАРТОЧКА АВТОРИЗАЦИИ
================================================== -->
    <main class="auth-wrapper">
        <section class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo">CP</div>

                <div>
                    <p class="auth-eyebrow">Crypto Portfolio</p>
                    <h1>Create account</h1>
                    <p class="auth-subtitle">
                        Start tracking your assets, transactions and portfolio value.
                    </p>
                </div>
            </div>

            <!-- ==================================================
            BLOCK 03 — AUTH FORM / ФОРМА ВХОДА ИЛИ РЕГИСТРАЦИИ
================================================== -->
            <form id="registerForm" class="auth-form">
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Your name" autocomplete="username">
                </div>

                <div class="auth-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="youremail@gmail.com" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" autocomplete="new-password">
                </div>

                <button type="submit" class="auth-submit-btn">
                    Register
                </button>
            </form>

            <p id="message" class="auth-message"></p>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </section>
    </main>
    
    <!-- ==================================================
    BLOCK 04 — JAVASCRIPT CONNECTION / ПОДКЛЮЧЕНИЕ JAVASCRIPT
================================================== -->
    <script src="js/auth.js"></script>
</body>
</html>
