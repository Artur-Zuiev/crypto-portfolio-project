spring.application.name=cryptoportfolio

spring.datasource.url=jdbc:postgresql://localhost:5432/crypto_portfolio
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=your_admin_username
spring.security.user.password=your_admin_password