spring.application.name=cryptoportfolio

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crypto_portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:change_me}

# Required: supply a unique secret of at least 32 UTF-8 bytes via environment
app.jwt.secret=${JWT_SECRET}
